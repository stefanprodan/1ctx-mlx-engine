name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Verify architecture
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint and type-check
        run: make lint
      - name: Check if working tree is dirty
        run: |
          if [[ $(git diff --stat) != '' ]]; then
            git --no-pager diff
            echo 'run make lint and commit changes'
            exit 1
          fi
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Smoke test binary
        run: |
          expected="v$(bun -e 'console.log(require("./package.json").version)')"
          test "$(./bin/1ctx-mlx-engine --version)" = "$expected"
          ./bin/1ctx-mlx-engine --help >/dev/null
      - name: Check the install script
        run: bash -n scripts/install.sh
      - name: Install from a local archive
        run: |
          set -euo pipefail
          dist="$(mktemp -d)"
          out="$(mktemp -d)"
          tar -C bin -czf "$dist/1ctx-mlx-engine_darwin_arm64.tar.gz" 1ctx-mlx-engine
          (cd "$dist" && shasum -a 256 1ctx-mlx-engine_darwin_arm64.tar.gz > 1ctx-mlx-engine_checksums.txt)
          expected="v$(bun -e 'console.log(require("./package.json").version)')"
          VERSION="$expected" DOWNLOAD_URL="file://$dist" INSTALL_DIR="$out" NO_SERVICE=1 \
            bash scripts/install.sh
          test "$("$out/1ctx-mlx-engine" --version)" = "$expected"
          # a checksum that does not match installs nothing
          echo "$(printf '0%.0s' {1..64})  1ctx-mlx-engine_darwin_arm64.tar.gz" > "$dist/1ctx-mlx-engine_checksums.txt"
          if VERSION="$expected" DOWNLOAD_URL="file://$dist" INSTALL_DIR="$out/bad" NO_SERVICE=1 \
            bash scripts/install.sh; then
            echo "a bad checksum was accepted" >&2
            exit 1
          fi
          test ! -e "$out/bad"
